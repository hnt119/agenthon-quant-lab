[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthon-quant-lab"
version = "0.3.1"
description = "Reproduce a cost-aware Bitcoin momentum study with independent portfolio verification"
readme = "PYPI.md"
requires-python = ">=3.12"
license = "MIT AND CC-BY-4.0 AND CC-BY-SA-4.0"
license-files = ["LICENSE", "DATA-NOTICES.md"]
dependencies = ["numpy==2.5.4", "scipy==1.18.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Source = "https://github.com/hnt119/agenthon-quant-lab"
Documentation = "https://github.com/hnt119/agenthon-quant-lab/blob/v0.3.0/docs/user-guide.md"
Study = "https://github.com/hnt119/agenthon-quant-lab/tree/v0.3.0/reports/btc-financial-v1"
Issues = "https://github.com/hnt119/agenthon-quant-lab/issues"

[project.optional-dependencies]
parquet = ["pyarrow>=15,<27"]

[project.scripts]
quant-lab = "agenthon_quant.cli:main"

# Map reviewed files directly into the wheel. The source distribution uses the
# same canonical files in their original locations.
[tool.setuptools]
packages = ["agenthon_quant", "agenthon_btc", "agenthon_financial", "agenthon_quant._bundled"]
package-dir = {"" = "src", "agenthon_quant._bundled" = "."}
include-package-data = false

[tool.setuptools.package-data]
"agenthon_quant._bundled" = [
    "pyproject.toml", "packaging/btc-compatibility.json",
    "examples/options.json", "examples/trading.json", "examples/historical.json",
    "examples/data/synthetic_prices.csv", "examples/data/README.md",
    "examples/data/bitstamp/btcusd-2025-q2.csv", "examples/data/bitstamp/README.md",
    "research/papers.json", "experiments/experiments.json",
    "experiments/btc-financial-v1/sessions.csv", "experiments/btc-financial-v1/source.json",
    "experiments/btc-financial-v1/protocol.json",
    "reports/btc-financial-v1/run.json", "reports/btc-financial-v1/features.jsonl",
    "reports/btc-financial-v1/fit.json", "reports/btc-financial-v1/ledger.jsonl.gz",
    "reports/btc-financial-v1/predictions.json", "reports/btc-financial-v1/metrics.json",
    "reports/btc-financial-v1/verification.json", "reports/btc-financial-v1/tables.csv",
    "reports/btc-financial-v1/equity.svg",
]
