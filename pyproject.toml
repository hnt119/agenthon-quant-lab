[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthon-quant-lab"
version = "0.3.0"
description = "Reproducible, independently checked options and trading research"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["scipy>=1.11,<2"]

[project.optional-dependencies]
parquet = ["pyarrow>=15,<27"]

[project.scripts]
quant-lab = "agenthon_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
