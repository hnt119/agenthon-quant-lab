name: Qualify Python distributions

on:
  pull_request:
  workflow_dispatch:
    inputs:
      wheel_sha256:
        description: Approved SHA-256 of the wheel attached to this release
        required: true
        type: string
      sdist_sha256:
        description: Approved SHA-256 of the source distribution attached to this release
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install build and metadata tools
        run: python -m pip install build twine
      - name: Build both formats for a pull request
        if: github.event_name == 'pull_request'
        run: python -m build --sdist --wheel --outdir dist
      - name: Fetch the two owner-approved release files
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL_SHA: ${{ inputs.wheel_sha256 }}
          SDIST_SHA: ${{ inputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "$GITHUB_REF" = "refs/tags/v$version"
          [[ "$WHEEL_SHA" =~ ^[a-f0-9]{64}$ && "$SDIST_SHA" =~ ^[a-f0-9]{64}$ ]]
          wheel="agenthon_quant_lab-${version}-py3-none-any.whl"
          sdist="agenthon_quant_lab-${version}.tar.gz"
          gh release download "$GITHUB_REF_NAME" --pattern "$wheel" --pattern "$sdist" --dir dist
          cd dist
          printf '%s  %s\n' "$WHEEL_SHA" "$wheel" "$SDIST_SHA" "$sdist" | sha256sum --check --strict
      - name: Rebuild from the source distribution and inspect contents
        run: |
          python -m twine check --strict dist/*
          python -m pip wheel --no-deps --no-cache-dir --wheel-dir rebuilt dist/*.tar.gz
          python scripts/check_distribution.py dist/*.whl dist/*.tar.gz rebuilt/*.whl
      - name: Exercise the actual wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/user-env"
          "$RUNNER_TEMP/user-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/user-env/bin/python" -I scripts/check_installed.py "$RUNNER_TEMP/quant-study"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: qualified-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agenthon-quant-lab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
