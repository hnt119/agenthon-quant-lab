name: Registered BTC paper clock
run-name: Paper allocation clock / ${{ github.event.schedule || github.event_name }}

on:
  schedule:
    - cron: '7 0 * * 1'
    - cron: '41 0 * * 1'
    - cron: '17 3 * * *'
  workflow_dispatch: {} # Qualification only. Manual clocks cannot record observations.

permissions: {}
jobs:
  tick:
    # Produce a dated workflow_run payload without allocating a hosted machine.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
