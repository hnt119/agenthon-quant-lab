name: Verify toolkit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install from source
        run: python scripts/setup.py
      - name: Verify dependencies
        run: .venv/bin/python -m agenthon_quant doctor
      - name: Check public projection
        run: .venv/bin/python scripts/export_site.py --check
      - name: Reproduce the frozen BTC study and check the public example
        run: |
          .venv/bin/quant-lab btc-study --out runs/btc-study-ci
          .venv/bin/python scripts/btc_public_example.py --check
      - name: Exercise reproducible workflows
        run: .venv/bin/python scripts/verify_release.py --out runs/ci-release
      - name: Independently check the saved and freshly calculated BTC/USD example
        run: |
          .venv/bin/python scripts/check_bitstamp_example.py --fixture examples/data/bitstamp/btcusd-2025-q2.csv --run reports/historical-q2/run.json
          .venv/bin/python scripts/check_bitstamp_example.py --fixture examples/data/bitstamp/btcusd-2025-q2.csv --run runs/ci-release/historical/run.json
      - name: Audit the weekly study's paired intervals and continuous portfolio balances
        run: .venv/bin/python scripts/check_weekly_study.py reports/btc-weekly-cadence-v1
      - name: Trace weekly allocation exhibits to the historical ledgers
        run: .venv/bin/python scripts/check_allocation_exhibit.py reports/btc-weekly-allocation-v1
