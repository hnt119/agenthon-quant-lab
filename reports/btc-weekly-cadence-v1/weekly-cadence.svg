<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" role="img" aria-labelledby="title desc"><title id="title">How did the weekly BTC decision schedule compare?</title><desc id="desc">Six pooled Sharpe differences for weekly momentum against passive BTC/cash and daily momentum, at zero, base and double costs. Dots to the right of zero favor weekly momentum. The horizontal capped lines show the two base-cost paired 95% intervals. The report tabulates all values.</desc><rect width="900" height="454" fill="#fff" /><style>text{font-family:Arial,Helvetica,sans-serif;fill:#23322c;font-size:14px}.heading{font-weight:bold;font-size:23px}.panel{font-weight:bold;font-size:16px}.small{font-size:12px}.grid{stroke:#d6dfdb}.zero{stroke:#43594c;stroke-dasharray:4 3}.interval{stroke:#885027;stroke-width:2.5}.estimate{fill:#1c6974;stroke:white;stroke-width:1.5}</style><text x="24" y="33" class="heading" text-anchor="start">How did the weekly BTC decision schedule compare?</text><text x="24" y="58" class="" text-anchor="start">Bitstamp BTC/USD spot · 2020–2024 · Positive Sharpe differences favor weekly momentum.</text><text x="788" y="87" class="small" text-anchor="start">Estimate</text><text x="24" y="93" class="panel" text-anchor="start">Weekly minus passive BTC/cash</text><line x1="126.000" y1="107" x2="126.000" y2="180" class="grid" /><line x1="285.500" y1="107" x2="285.500" y2="180" class="grid" /><line x1="445.000" y1="107" x2="445.000" y2="180" class="zero" /><line x1="604.500" y1="107" x2="604.500" y2="180" class="grid" /><line x1="764.000" y1="107" x2="764.000" y2="180" class="grid" /><text x="32" y="121" class="" text-anchor="start">Zero costs</text><circle cx="425.256" cy="117" r="5" class="estimate"><title>Weekly minus passive BTC/cash, zero costs: -0.062</title></circle><text x="788" y="121" class="" text-anchor="start">-0.062</text><text x="32" y="148" class="" text-anchor="start">Base costs</text><line x1="180.922" y1="144" x2="527.608" y2="144" class="interval" /><line x1="180.922" y1="139" x2="180.922" y2="149" class="interval" /><line x1="527.608" y1="139" x2="527.608" y2="149" class="interval" /><circle cx="361.891" cy="144" r="5" class="estimate"><title>Weekly minus passive BTC/cash, base costs: -0.261</title></circle><text x="788" y="148" class="" text-anchor="start">-0.261</text><text x="32" y="175" class="" text-anchor="start">Double costs</text><circle cx="298.128" cy="171" r="5" class="estimate"><title>Weekly minus passive BTC/cash, double costs: -0.460</title></circle><text x="788" y="175" class="" text-anchor="start">-0.460</text><text x="24" y="230" class="panel" text-anchor="start">Weekly minus daily momentum</text><line x1="126.000" y1="244" x2="126.000" y2="317" class="grid" /><text x="126.000" y="335" class="small" text-anchor="middle">-1.00</text><line x1="285.500" y1="244" x2="285.500" y2="317" class="grid" /><text x="285.500" y="335" class="small" text-anchor="middle">-0.50</text><line x1="445.000" y1="244" x2="445.000" y2="317" class="zero" /><text x="445.000" y="335" class="small" text-anchor="middle">0.00</text><line x1="604.500" y1="244" x2="604.500" y2="317" class="grid" /><text x="604.500" y="335" class="small" text-anchor="middle">0.50</text><line x1="764.000" y1="244" x2="764.000" y2="317" class="grid" /><text x="764.000" y="335" class="small" text-anchor="middle">1.00</text><text x="32" y="258" class="" text-anchor="start">Zero costs</text><circle cx="376.887" cy="254" r="5" class="estimate"><title>Weekly minus daily momentum, zero costs: -0.214</title></circle><text x="788" y="258" class="" text-anchor="start">-0.214</text><text x="32" y="285" class="" text-anchor="start">Base costs</text><line x1="351.376" y1="281" x2="606.179" y2="281" class="interval" /><line x1="351.376" y1="276" x2="351.376" y2="286" class="interval" /><line x1="606.179" y1="276" x2="606.179" y2="286" class="interval" /><circle cx="470.789" cy="281" r="5" class="estimate"><title>Weekly minus daily momentum, base costs: +0.081</title></circle><text x="788" y="285" class="" text-anchor="start">+0.081</text><text x="32" y="312" class="" text-anchor="start">Double costs</text><circle cx="562.084" cy="308" r="5" class="estimate"><title>Weekly minus daily momentum, double costs: +0.367</title></circle><text x="788" y="312" class="" text-anchor="start">+0.367</text><text x="24" y="366" class="" text-anchor="start">Dots show pooled Sharpe differences. Capped lines show the paired 95% intervals at base costs.</text><text x="24" y="390" class="" text-anchor="start">At base costs each fill incurs a 50 bp fee and 10 bp adverse slippage. The double-cost case doubles both.</text><text x="24" y="414" class="small" text-anchor="start">Both schedules use the same 20-session signal. This comparison reuses previously examined history.</text><text x="24" y="438" class="small" text-anchor="start">Adapted from Zielak (mczielinski), Bitcoin Historical Data, v706, normalized by ff137 · CC BY-SA 4.0</text></svg>